document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *, *::before, *::after { box-sizing:border-box; }\n  html { scroll-behavior:smooth; }\n  body { margin:0; background:#0a0c0e; color:#e6e3dc; font-family:'Archivo',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }\n  a { color:#e8a33d; text-decoration:none; }\n  a:hover { color:#f2efe9; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#0a0c0e;overflow-x:hidden;\">\n\n  <nav style=\"position:sticky;top:0;z-index:30;background:rgba(10,12,14,0.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(242,239,233,0.12);\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:0 clamp(18px,4vw,44px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;\">\n      <a href=\"#top\" style=\"display:flex;align-items:center;gap:13px;color:#e6e3dc;\">\n        <span style=\"width:30px;height:30px;border:1px solid #e8a33d;color:#e8a33d;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:14px;flex-shrink:0;\">◈<\u002Fspan>\n        <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;letter-spacing:-0.02em;\">Auracelle <span style=\"color:#e8a33d;\">StressPoint<\u002Fspan><\u002Fspan>\n      <\u002Fa>\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,2.4vw,30px);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;\">\n        <a href=\"#why\" style=\"color:#949d9d;\">Why<\u002Fa>\n        <a href=\"#experience\" style=\"color:#949d9d;\">Experience<\u002Fa>\n        <a href=\"#research\" style=\"color:#949d9d;\">Research<\u002Fa>\n        <a href=\"#access\" style=\"color:#949d9d;\">Access<\u002Fa>\n      <\u002Fdiv>\n      <a href=\"https://auracelle.github.io/Auracelle-Charlie-BSU-Research-Workshop-June2026/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid #e8a33d;color:#e8a33d;padding:10px 16px;white-space:nowrap;\">Research env ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main id=\"top\">\n\n    <section style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(18px,4vw,44px) clamp(28px,4vw,48px);\">\n      <div style=\"display:flex;align-items:center;gap:11px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#e8a33d;\">\n        <span style=\"width:7px;height:7px;background:#e8a33d;display:block;\"><\u002Fspan>Asynchronous governance wargaming\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(3rem,9vw,8rem);line-height:0.86;letter-spacing:-0.055em;margin:clamp(18px,3vw,30px) 0 0;max-width:19ch;text-wrap:balance;\">AI Governance Ecosystem <span style=\"font-weight:400;color:#8b9a9e;\">Asynchronous Wargame Stress-Testing<\u002Fspan><\u002Fh1>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(20px,4vw,52px);margin-top:clamp(24px,3vw,38px);align-items:end;\">\n        <p style=\"font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:#b9bfba;margin:0;max-width:56ch;text-wrap:pretty;\">StressPoint takes a real document — a policy, treaty, standard or legal instrument — and tests whether it holds. It returns a quantified Policy Stress-Test Outcome Assessment alongside a qualitative read against existing policy and treaty precedent, then names the gaps that open when the document is challenged at a contested negotiation table.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n          <a href=\"https://auracelle.github.io/Auracelle-Charlie-BSU-Research-Workshop-June2026/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;background:#e8a33d;color:#0a0c0e;padding:15px 22px;font-weight:700;\">Explore StressPoint ↗<\u002Fa>\n          <a href=\"#research\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid rgba(242,239,233,0.28);color:#e6e3dc;padding:15px 22px;\">Research context ↓<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1280px;margin:0 auto;padding:0 clamp(18px,4vw,44px) clamp(56px,7vw,104px);\">\n      <div style=\"border:1px solid rgba(242,239,233,0.14);background:#0d1114;\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:14px clamp(16px,2.4vw,24px);border-bottom:1px solid rgba(242,239,233,0.12);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#7e8a89;\">\n          <span>Ecosystem lattice — {{ epicenter }} under load<\u002Fspan>\n          <span style=\"{{ statusStyle }}\">● {{ statusLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"position:relative;background:radial-gradient(circle at 50% 44%, #16202a 0%, #0b0f12 62%);\">\n          <div style=\"height:clamp(360px,54vw,580px);\">\n            <x-import component-from-global-scope=\"stress-lattice\" pressure=\"{{ pressureVal }}\" autorotate=\"{{ autoRotate }}\" epicenter=\"{{ epicenter }}\" hint-size=\"100%,100%\"><\u002Fx-import>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:clamp(14px,2vw,22px);top:clamp(14px,2vw,22px);display:flex;flex-direction:column;gap:7px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;color:#8d9795;pointer-events:none;\">\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:16px;height:2px;background:#4a6670;display:block;\"><\u002Fspan>Within tolerance<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:16px;height:2px;background:#e8a33d;display:block;\"><\u002Fspan>Under strain<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:16px;height:2px;background:#d9544f;display:block;\"><\u002Fspan>Failure threshold<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:16px;height:2px;background:#2b3238;display:block;\"><\u002Fspan>As written — flat reference<\u002Fdiv>\n            <div style=\"max-width:20ch;line-height:1.45;color:#6d7876;padding-top:4px;\">Lattice sectioned into six domain sectors. Strain crosses the seams into adjacent domains.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;right:clamp(14px,2vw,22px);bottom:clamp(14px,2vw,22px);font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;color:#6d7876;pointer-events:none;\">Drag to orbit<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:16px clamp(16px,2.4vw,24px);border-top:1px solid rgba(242,239,233,0.12);\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#7e8a89;\">Stress origin — domain<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <sc-for list=\"{{ domains }}\" as=\"d\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ d.pick }}\" style=\"{{ d.style }}\" style-hover=\"color:#f2efe9;border-color:rgba(242,239,233,0.45);\">{{ d.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:16px clamp(16px,2.4vw,24px);border-top:1px solid rgba(242,239,233,0.12);\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#7e8a89;\">Applied pressure<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:0;border:1px solid rgba(242,239,233,0.2);\">\n            <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ l.pick }}\" style=\"{{ l.style }}\" style-hover=\"color:#f2efe9;\">{{ l.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,232px),1fr));border-top:1px solid rgba(242,239,233,0.12);\">\n          <div style=\"padding:clamp(20px,2.4vw,28px);border-right:1px solid rgba(242,239,233,0.12);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:#7e8a89;\">PSTOA outcome<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(34px,4vw,48px);line-height:1;letter-spacing:-0.03em;margin-top:10px;color:#f2efe9;\">{{ adequacy }}<\u002Fdiv>\n            <div style=\"font-size:16px;color:#a7afac;margin-top:6px;\">{{ adequacyNote }}<\u002Fdiv>\n            <div style=\"height:5px;background:#1d2427;margin-top:16px;\"><div style=\"{{ adequacyBar }}\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:clamp(20px,2.4vw,28px);border-right:1px solid rgba(242,239,233,0.12);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:#7e8a89;\">Negotiation state<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(24px,2.6vw,30px);line-height:1.1;margin-top:10px;color:#f2efe9;\">{{ negState }}<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.55;color:#a7afac;margin-top:8px;text-wrap:pretty;\">{{ negNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:clamp(20px,2.4vw,28px);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:#7e8a89;\">Decision signal<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(24px,2.6vw,30px);line-height:1.1;margin-top:10px;color:#f2efe9;\">{{ signal }}<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.55;color:#a7afac;margin-top:8px;text-wrap:pretty;\">{{ signalNote }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.6;color:#6d7876;margin-top:12px;\">Illustrative model. No single domain is governed in isolation — pressure on one propagates across every instrument that depends on it. Analytical methods and scoring logic are not published here.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"why\" style=\"border-top:1px solid rgba(242,239,233,0.12);\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(18px,4vw,44px);\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#e8a33d;\">Why StressPoint<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(2.1rem,4.6vw,4.2rem);line-height:1.02;letter-spacing:-0.04em;margin:16px 0 0;max-width:24ch;text-wrap:balance;\">Written governance is not the same as resilient governance.<\u002Fh2>\n        <p style=\"font-size:clamp(17px,1.4vw,19px);line-height:1.6;color:#a7afac;max-width:62ch;margin:20px 0 0;text-wrap:pretty;\">A document can be complete on paper and still fail when real actors interpret, negotiate, resist, adapt or respond to unexpected events. StressPoint assesses the document itself — quantitatively and qualitatively — and then puts it under the pressures that decide whether it survives contact.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,288px),1fr));gap:clamp(14px,1.6vw,22px);margin-top:clamp(32px,4vw,56px);\">\n          <div style=\"background:#0d1114;border:1px solid rgba(242,239,233,0.14);padding:clamp(24px,2.6vw,34px);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.14em;color:#e8a33d;\">01 · ASSESS<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(22px,2.2vw,27px);line-height:1.15;margin-top:18px;color:#f2efe9;\">Score the document<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:10px 0 0;text-wrap:pretty;\">A policy, treaty, standard or legal instrument is read in and evaluated against the Policy Stress-Test Outcome Assessment — a quantified reading of the document as written, not an impression of it.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#0d1114;border:1px solid rgba(242,239,233,0.14);padding:clamp(24px,2.6vw,34px);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.14em;color:#e8a33d;\">02 · COMPARE<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(22px,2.2vw,27px);line-height:1.15;margin-top:18px;color:#f2efe9;\">Set it against precedent<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:10px 0 0;text-wrap:pretty;\">The quantified result is paired with a qualitative read against existing policies and treaties, so the score is interpreted against instruments that have already met real institutional pressure.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#0d1114;border:1px solid rgba(242,239,233,0.14);padding:clamp(24px,2.6vw,34px);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.14em;color:#e8a33d;\">03 · EXPOSE<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(22px,2.2vw,27px);line-height:1.15;margin-top:18px;color:#f2efe9;\">Name the gaps<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:10px 0 0;text-wrap:pretty;\">Play surfaces where the provisions give way under challenge, which geopolitical pressures threaten adoption, and specifically how the text could be strengthened before it is negotiated for real.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"experience\" style=\"border-top:1px solid rgba(242,239,233,0.12);background:#0d1114;\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(18px,4vw,44px);\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#e8a33d;\">The experience<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(2.1rem,4.6vw,4.2rem);line-height:1.02;letter-spacing:-0.04em;margin:16px 0 0;max-width:26ch;text-wrap:balance;\">A contested negotiation table, built for asynchronous play.<\u002Fh2>\n        <p style=\"font-size:clamp(17px,1.4vw,19px);line-height:1.6;color:#a7afac;max-width:62ch;margin:20px 0 0;text-wrap:pretty;\">The assessed document does not stay on the page. Participants engage from distinct roles and challenge its provisions clause by clause, while an agentic AI opposition learns from the moves already played and turns that learning back on the weakest part of the text.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(24px,3vw,44px);margin-top:clamp(32px,4vw,56px);align-items:start;\">\n          <div>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(21px,2vw,25px);color:#f2efe9;\">Human-in-the-loop by design<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:10px 0 0;text-wrap:pretty;\">StressPoint is not intended to replace human judgment. It is designed to expose judgment to structured pressure and make the consequences of competing decisions easier to examine.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:0;margin-top:26px;border-top:1px solid rgba(242,239,233,0.14);\">\n              <div style=\"display:grid;grid-template-columns:44px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid rgba(242,239,233,0.14);align-items:start;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#e8a33d;\">A<\u002Fspan>\n                <div><div style=\"font-size:17.5px;font-weight:600;color:#f2efe9;\">Assume a role<\u002Fdiv><div style=\"font-size:16px;line-height:1.55;color:#a7afac;margin-top:3px;\">Enter the problem from a defined institutional or stakeholder perspective.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:44px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid rgba(242,239,233,0.14);align-items:start;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#e8a33d;\">B<\u002Fspan>\n                <div><div style=\"font-size:17.5px;font-weight:600;color:#f2efe9;\">Make a move<\u002Fdiv><div style=\"font-size:16px;line-height:1.55;color:#a7afac;margin-top:3px;\">Choose a response and commit to a governance position.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:44px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid rgba(242,239,233,0.14);align-items:start;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#e8a33d;\">C<\u002Fspan>\n                <div><div style=\"font-size:17.5px;font-weight:600;color:#f2efe9;\">Encounter opposition<\u002Fdiv><div style=\"font-size:16px;line-height:1.55;color:#a7afac;margin-top:3px;\">Respond to another human participant or an AI-enabled opposing actor.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:44px 1fr;gap:18px;padding:18px 0;align-items:start;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#e8a33d;\">D<\u002Fspan>\n                <div><div style=\"font-size:17.5px;font-weight:600;color:#f2efe9;\">Examine the outcome<\u002Fdiv><div style=\"font-size:16px;line-height:1.55;color:#a7afac;margin-top:3px;\">Review the pressures, trade-offs and decision signals generated through play.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(21px,2vw,25px);color:#f2efe9;\">An opposition that learns<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:10px 0 0;text-wrap:pretty;\">The agentic AI opposition is not a script. It reads the pattern of moves a group makes and probes accordingly, exposing the geopolitical stress points — sovereignty, compute access, enforcement asymmetry, strategic advantage — most likely to decide whether a provision is adopted or hollowed out.<\u002Fp>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:14px 0 0;text-wrap:pretty;\">Governance rarely fails for one reason. StressPoint holds institutions, incentives, human behaviour, geopolitical pressure and technological change in the same frame, without pretending those forces reduce to a single answer.<\u002Fp>\n            <blockquote style=\"border-left:2px solid #e8a33d;margin:28px 0 0;padding:6px 0 6px 24px;font-family:'Bricolage Grotesque',sans-serif;font-weight:400;font-size:clamp(20px,2.3vw,28px);line-height:1.3;letter-spacing:-0.02em;color:#f2efe9;text-wrap:pretty;\">“The question is not simply whether a policy exists. The question is whether it remains adequate when people, institutions and conditions push back.”<\u002Fblockquote>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid rgba(242,239,233,0.12);\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(18px,4vw,44px);\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#e8a33d;\">The position<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(28px,4vw,60px);margin-top:18px;align-items:start;\">\n          <div>\n            <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2.2rem,5vw,4.4rem);line-height:0.98;letter-spacing:-0.05em;margin:0;max-width:18ch;text-wrap:balance;\">A harder standard for advanced AI.<\u002Fh2>\n            <div style=\"height:2px;background:#e8a33d;width:120px;margin:26px 0 0;\"><\u002Fdiv>\n            <p style=\"font-size:clamp(18px,1.6vw,21px);line-height:1.55;color:#cfd4cf;margin:26px 0 0;max-width:52ch;text-wrap:pretty;\">Governance must keep pace with capability. The central question is not whether advanced AI systems are tested before deployment — it is whether the standard of oversight is strong enough for the complexity of the systems now emerging.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-size:16.5px;line-height:1.65;color:#a7afac;margin:0;text-wrap:pretty;\">As capability accelerates, governance has to do more than document known issues or confirm baseline compliance. It must be able to stand up to uncertainty, real-world pressure, and the broader consequences that powerful systems create once deployed.<\u002Fp>\n            <p style=\"font-size:16.5px;line-height:1.65;color:#a7afac;margin:16px 0 0;text-wrap:pretty;\">So the conversation should not stop at whether testing happens. It should turn to what kind of governance standard is credible for advanced AI — one serious about responsibility, resilience and real-world impact.<\u002Fp>\n            <p style=\"font-size:16.5px;line-height:1.65;color:#f2efe9;margin:16px 0 0;text-wrap:pretty;\">StressPoint exists to make that standard testable: not a claim that a safeguard is adequate, but evidence of where it gives way.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"research\" style=\"border-top:1px solid rgba(242,239,233,0.12);background:#f2efe9;color:#0a0c0e;\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(18px,4vw,44px);\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,4vw,56px);align-items:start;\">\n          <div>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#a06a10;\">Doctoral research instrument<\u002Fdiv>\n            <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(2.1rem,4.4vw,3.8rem);line-height:1.02;letter-spacing:-0.04em;margin:16px 0 0;max-width:22ch;text-wrap:balance;\">Developed through research. Tested through play.<\u002Fh2>\n            <p style=\"font-size:clamp(17px,1.4vw,19px);line-height:1.6;color:#3f4642;max-width:58ch;margin:20px 0 0;text-wrap:pretty;\">StressPoint was developed from the Accelerated Governance Policy Optimization research methodology and forms part of Grace-Alice Evans' doctoral research at Bath Spa University, under the supervision of Dr. John Curry.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:26px;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid rgba(10,12,14,0.24);padding:8px 13px;color:#2c322f;\">Bath Spa University<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid rgba(10,12,14,0.24);padding:8px 13px;color:#2c322f;\">Doctoral research<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid rgba(10,12,14,0.24);padding:8px 13px;color:#2c322f;\">Matrix wargaming<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid rgba(10,12,14,0.24);padding:8px 13px;color:#2c322f;\">Human-in-the-loop<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid rgba(10,12,14,0.24);padding:8px 13px;color:#2c322f;\">Asynchronous play<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid rgba(10,12,14,0.24);padding:8px 13px;color:#2c322f;\">AI governance<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <aside style=\"background:#0a0c0e;color:#e6e3dc;padding:clamp(26px,3vw,36px);border-top:4px solid #e8a33d;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#e8a33d;\">Public research note<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.65;color:#bdc3bf;margin:14px 0 0;text-wrap:pretty;\">This page describes StressPoint at the capability level. Detailed analytical methods, scoring logic, learning architecture, implementation methods and framework documentation are intentionally not published here.<\u002Fp>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid rgba(242,239,233,0.12);\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(18px,4vw,44px);\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#e8a33d;\">Use contexts<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(2.1rem,4.6vw,4.2rem);line-height:1.02;letter-spacing:-0.04em;margin:16px 0 0;max-width:22ch;text-wrap:balance;\">Built for difficult governance questions.<\u002Fh2>\n        <p style=\"font-size:clamp(17px,1.4vw,19px);line-height:1.6;color:#a7afac;max-width:62ch;margin:20px 0 0;text-wrap:pretty;\">The case is sharpest for frontier and emerging technology, where safeguards are being written for capability that does not yet exist and the cost of an inadequate provision is paid after deployment.<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:0;margin-top:clamp(32px,4vw,52px);border-top:1px solid rgba(242,239,233,0.14);\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(10px,2vw,36px);padding:clamp(22px,2.6vw,32px) 0;border-bottom:1px solid rgba(242,239,233,0.14);align-items:baseline;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#7fb2c4;\">Frontier &amp; emerging tech<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(22px,2.2vw,28px);line-height:1.15;color:#f2efe9;\">Responsible AI safeguards<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:0;text-wrap:pretty;\">Test whether a safeguard, threshold or reporting duty still binds when capability, incentives or stakeholder behaviour moves past the assumptions it was drafted on.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(10px,2vw,36px);padding:clamp(22px,2.6vw,32px) 0;border-bottom:1px solid rgba(242,239,233,0.14);align-items:baseline;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#7fb2c4;\">Institutions<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(22px,2.2vw,28px);line-height:1.15;color:#f2efe9;\">Coordination under stress<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:0;text-wrap:pretty;\">Examine how governance performs across organisations, sectors and jurisdictions when alignment is incomplete.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(10px,2vw,36px);padding:clamp(22px,2.6vw,32px) 0;align-items:baseline;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#7fb2c4;\">Treaties &amp; legal text<\u002Fdiv>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(22px,2.2vw,28px);line-height:1.15;color:#f2efe9;\">Drafting under challenge<\u002Fdiv>\n            <p style=\"font-size:16.5px;line-height:1.6;color:#a7afac;margin:0;text-wrap:pretty;\">Score a draft instrument, compare it against precedent, and see which clauses are conceded first when the text reaches a contested table.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"access\" style=\"border-top:1px solid rgba(242,239,233,0.12);background:#0d1114;\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(18px,4vw,44px);\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#e8a33d;\">Auracelle AI Governance Labs<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2.3rem,5.6vw,5rem);line-height:0.98;letter-spacing:-0.05em;margin:18px 0 0;max-width:24ch;text-wrap:balance;\">Put governance under pressure before reality does.<\u002Fh2>\n        <p style=\"font-size:clamp(17px,1.4vw,19px);line-height:1.6;color:#a7afac;max-width:58ch;margin:20px 0 0;text-wrap:pretty;\">Explore the research environment, or contact Grace-Alice Evans at <a href=\"mailto:EvansAGrace@gmail.com?subject=StressPoint%20log-in%20access\">EvansAGrace@gmail.com<\u002Fa> regarding log-in access, research collaboration, demonstrations and institutional use.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:32px;\">\n          <a href=\"https://auracelle.github.io/Auracelle-Charlie-BSU-Research-Workshop-June2026/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;background:#e8a33d;color:#0a0c0e;padding:15px 22px;font-weight:700;\">Enter StressPoint ↗<\u002Fa>\n          <a href=\"mailto:EvansAGrace@gmail.com?subject=StressPoint%20log-in%20access\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid rgba(242,239,233,0.28);color:#e6e3dc;padding:15px 22px;\">Contact Grace-Alice Evans for Log-in Access ✉<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <footer style=\"border-top:1px solid rgba(242,239,233,0.12);\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:28px clamp(18px,4vw,44px) 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;color:#7e8a89;\">\n      <div>Auracelle StressPoint · Auracelle AI Governance Labs<\u002Fdiv>\n      <div>Doctoral research instrument · Bath Spa University · Supervised by Dr. John Curry<\u002Fdiv>\n      <div>© 2026 Grace-Alice Evans. All rights reserved.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startingPressure&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Nominal&quot;,&quot;Contested&quot;,&quot;Adversarial&quot;],&quot;default&quot;:&quot;Contested&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Model&quot;},&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Model&quot;}}\">\nconst LEVELS = [\n  { label:'Nominal', val:0.5,  status:'BASELINE STABLE', statusColor:'#7fb2c4',\n    adequacy:'92', adequacyNote:'Provisions hold as drafted', bar:'#7fb2c4',\n    neg:'Aligned', negNote:'Stakeholder positions converge without concession pressure.',\n    signal:'No action', signalNote:'Structure absorbs load with margin remaining.' },\n  { label:'Contested', val:1.0, status:'GOVERNANCE TEST ACTIVE', statusColor:'#e8a33d',\n    adequacy:'74', adequacyNote:'Holding — two clauses straining', bar:'#e8a33d',\n    neg:'Contested', negNote:'Competing stakeholder positions remain unresolved; coalition still viable.',\n    signal:'Gate Controlled / Review Required', signalNote:'New pressure point identified. Further testing recommended.' },\n  { label:'Adversarial', val:1.8, status:'THRESHOLD BREACHED', statusColor:'#d9544f',\n    adequacy:'41', adequacyNote:'Inadequate — enforcement clause conceded', bar:'#d9544f',\n    neg:'Fragmenting', negNote:'Defection observed. Coalition no longer holds at the agreed threshold.',\n    signal:'Escalate', signalNote:'Provisions inadequate under sustained load. Redesign indicated.' },\n];\n\nconst DOMAINS = ['AI', 'Quantum', 'BioTech', 'Cybersecurity', 'Nuclear', '5G/6G'];\n\nclass Component extends DCLogic {\n  state = { level: -1, domain: 0 };\n\n  renderVals() {\n    const dflt = { Nominal:0, Contested:1, Adversarial:2 }[this.props.startingPressure ?? 'Contested'] ?? 1;\n    const i = this.state.level < 0 ? dflt : this.state.level;\n    const L = LEVELS[i];\n    const pct = { 0:92, 1:74, 2:41 }[i];\n\n    return {\n      levels: LEVELS.map((l, n) => ({\n        label: l.label,\n        pick: () => this.setState({ level: n }),\n        style: (n === i\n          ? 'background:#e8a33d;color:#0a0c0e;font-weight:700;'\n          : 'background:transparent;color:#949d9d;')\n          + (n > 0 ? 'border-left:1px solid rgba(242,239,233,0.2);' : '')\n          + \"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding:11px 18px;cursor:pointer;user-select:none;\",\n      })),\n      epicenter: DOMAINS[this.state.domain],\n      domains: DOMAINS.map((d, n) => ({\n        label: d,\n        pick: () => this.setState({ domain: n }),\n        style: (n === this.state.domain\n          ? 'border:1px solid #d9544f;color:#f2efe9;background:rgba(217,84,79,0.16);font-weight:700;'\n          : 'border:1px solid rgba(242,239,233,0.2);color:#949d9d;background:transparent;')\n          + \"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;padding:9px 13px;cursor:pointer;user-select:none;\",\n      })),\n      pressureVal: L.val,\n      autoRotate: (this.props.autoRotate ?? true) ? 'true' : 'false',\n      statusLabel: L.status,\n      statusStyle: `color:${L.statusColor};font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;`,\n      adequacy: L.adequacy,\n      adequacyNote: L.adequacyNote,\n      adequacyBar: `height:100%;width:${pct}%;background:${L.bar};`,\n      negState: L.neg, negNote: L.negNote,\n      signal: L.signal, signalNote: L.signalNote,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
